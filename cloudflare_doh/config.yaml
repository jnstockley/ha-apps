name: "Cloudflare DoH"
version: "1.1.0"
slug: "cloudflare_doh"
description: "A local DNS server that forwards queries to Cloudflare over HTTPS."
url: "https://github.com/jnstockley/ha-apps"

arch:
  - amd64
  - aarch64

init: false
startup: services
boot: auto

# cloudflared listens on 5053 in the container. The default host mapping is
# port 53, so clients can use the Home Assistant host as a normal DNS server.
ports:
  5053/tcp: 53
  5053/udp: 53
ports_description:
  5053/tcp: "DNS over TCP"
  5053/udp: "DNS over UDP"
watchdog: "tcp://[HOST]:[PORT:5053]"

options:
  upstreams: "https://1.1.1.1/dns-query,https://1.0.0.1/dns-query"
  bootstrap: "https://162.159.36.1/dns-query,https://162.159.46.1/dns-query"
  max_upstream_conns: 5
  metrics: "127.0.0.1:39441"
schema:
  upstreams: "str(1,2048)"
  bootstrap: "str(1,2048)"
  max_upstream_conns: "int(0,1000)"
  metrics: "str(1,255)"
