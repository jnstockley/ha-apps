# yamllint configuration -- https://yamllint.readthedocs.io/
extends: default

rules:
  line-length: disable
  document-start: disable
  truthy:
    # config.yaml legitimately uses bare "yes/no/true/false"-style
    # values in a couple of places; keep this relaxed for app configs.
    check-keys: false
  comments:
    min-spaces-from-content: 1
