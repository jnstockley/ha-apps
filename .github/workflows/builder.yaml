name: Builder

# Detects which app folder(s) changed and builds only those. Works for a
# single app today and scales automatically if you add more app folders
# later. Mirrors the pattern used in the official
# https://github.com/home-assistant/apps-example repository.

env:
  MONITORED_FILES: "config.json config.yaml config.yml Dockerfile rootfs"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  init:
    name: Initialize builds
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      changed_apps: ${{ steps.filter.outputs.changed_apps }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Get changed files
        id: changed_files
        uses: tj-actions/changed-files@v47

      - name: Find app directories
        id: apps
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Filter changed apps
        id: filter
        env:
          APPS: ${{ steps.apps.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_changed_files }}
        run: |
          changed_apps=()

          # If the workflows themselves changed, rebuild every app.
          if [[ "${CHANGED_FILES}" =~ \.github/workflows/(builder|build-app)\.yaml ]]; then
            changed_apps=(${APPS})
          else
            for app in ${APPS}; do
              for file in ${MONITORED_FILES}; do
                if [[ "${CHANGED_FILES}" =~ ${app}/${file} ]]; then
                  changed_apps+=("${app}")
                  break
                fi
              done
            done
          fi

          if [[ ${#changed_apps[@]} -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_apps=$(jq -nc '$ARGS.positional' --args "${changed_apps[@]}")" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-app:
    name: Build ${{ matrix.app }}
    needs: init
    if: needs.init.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.init.outputs.changed_apps) }}
    uses: ./.github/workflows/build-app.yaml
    with:
      app: ${{ matrix.app }}
      publish: ${{ github.event_name == 'push' }}
    secrets: inherit

  release:
    name: Release ${{ matrix.app }}
    needs: [init, build-app]
    if: >-
      github.event_name == 'push' &&
      needs.init.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: app-releases-${{ github.repository }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: ${{ fromJSON(needs.init.outputs.changed_apps) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release if the version is new
        env:
          APP: ${{ matrix.app }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep -m1 '^version:' "${APP}/config.yaml" | sed -E 's/^version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')
          tag="${APP}-v${version}"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists, skipping."
          else
            previous_tag=$(gh release list \
              --repo "${GITHUB_REPOSITORY}" \
              --limit 100 \
              --json tagName,publishedAt | \
              jq -r --arg prefix "${APP}-v" \
                'map(select(.tagName | startswith($prefix))) | sort_by(.publishedAt) | last | .tagName // empty')

            changes_file="$(mktemp)"
            notes_file="$(mktemp)"
            changelog_file="${APP}/CHANGELOG.md"
            trap 'rm -f "${changes_file}" "${notes_file}"' EXIT
            if [[ -n "${previous_tag}" ]]; then
              git log \
                --format="- %s (\`%h\`)" \
                --invert-grep \
                --grep='^chore: update release changelog$' \
                "${previous_tag}..${GITHUB_SHA}" > "${changes_file}"
            else
              echo "- Initial release." > "${changes_file}"
            fi

            {
              echo "## Changes"
              echo
              if [[ -n "${previous_tag}" ]]; then
                echo "Changes since \`${previous_tag}\`:"
                echo
              fi
              cat "${changes_file}"
            } > "${notes_file}"

            changelog_temp="$(mktemp "${changelog_file}.XXXXXX")"
            {
              sed -n '1,5p' "${changelog_file}"
              echo "## [${version}] - $(date -u +%F)"
              echo
              echo "### Changed"
              echo
              cat "${changes_file}"
              echo
              sed -n '6,$p' "${changelog_file}"
            } > "${changelog_temp}"
            mv "${changelog_temp}" "${changelog_file}"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${changelog_file}"
            git commit -m "chore: update release changelog"
            git push origin "HEAD:${GITHUB_REF_NAME}"

            gh release create "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${APP} ${version}" \
              --notes-file "${notes_file}" \
              --target "${GITHUB_SHA}"
          fi
